<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
        <link rel="stylesheet" href="{{ url_for('static', filename='css/sample.css') }}">
        <title>{% block title %} 「ここは変える」タイトルデフォルト{% endblock %}</title>
    </head>
    
    <!-- created header to acces into other webpage-->
    <body>
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">翼のブイログ</a>
            <div class="navbar-nav">
                <a class="nav-link" href="/">ホーム</a>

                {% if current_user.is_authenticated %}
                    <a class="nav-link" href="/admin">管理画面</a>
                    <a class="nav-link" href="/create">新規登録</a>
                    <a class="nav-link" href="/logout">ログアウト</a>
                {% else %}
                    <a class="nav-link" href="/login">ログイン</a>
                {% endif %}
            </div>
        </div>
    </nav>

    {% block content %}
    {% endblock %}

    <!-- Webアプリの下部に表示される共通部分を作り、ページのレイアウトを完成 -->
    <footer class="bg-dark text-light mt-5 py-4">
        <div class="container text-center">
            <p class="mb-1">翼のブイログ</p>
            <p class="mb-1">アメリカ生活、日常や旅の思い出をお伝えします</p>

            <!-- 僕のアドレスを入れるなどはまた今度考えてみる! -->
            <p class="mb-1"><a href="/" class="text-light">ホーム</a> | <a href="mailto:example@example.com" class="text-light">お問い合わせ</a></p>
            <p class="mb-0">&copy; 2026 Tsubasa. All Rights Reserved.</p>
        </div>
    </footer>
    </body>
</html>

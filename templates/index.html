{% extends "base.html" %}
{% block title %}vlogpage{% endblock %}
{% block content %}
<div class="container my-5">

    <div class="text-center mb-4">
        <h2>翼のブイログ</h2>
        <p>アメリカ生活、日常や旅の思い出をお伝えします</p>
    </div>

    <div class="row row-cols-3 g-4">
        {% for post in posts %}
        <div class="col">
            <div class="card">
                <img src="{{ url_for('static', filename='img/' + post.img_name) }}" class="card-img-top">
                <div class="card-body">
                    <h5 class="card-title"><a href="/{{ post.id }}/read_more">{{ post.title }}</a></h5>
                    <p class="card-text">{{ post.body[:10] }}</p>
                    <p>{{ post.created_at.strftime('%Y年%m月%d日 %H時%M分') }}</p>

                
                </div>
            </div>
        </div>
        {% endfor %}
    </div>
</div>
{% endblock %}
